[package]
name = "storage_manager"
version = "0.1.0"
edition = "2024"
company_name = "The Core Storage"
database_file = "StorageManager.db"

[dependencies]
eframe = { version = "=0.31.1", features = ["glow", "x11", "wayland"] }
egui = "=0.31.1"
rusqlite = { version = "0.32" , features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
toml = "1"
